name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
        
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Generate Keystore
      run: |
        keytool -genkeypair \
          -keystore app/debug.keystore \
          -storepass android \
          -keypass android \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US" \
          -v

    - name: Add JDK access permissions
      run: |
        echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 \
        --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
        --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
        --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED \
        --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED \
        --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED \
        --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED \
        --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
        --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED" >> gradle.properties

    - name: Build APK
      run: ./gradlew assembleRelease
      env:
        SIGNING_STORE_FILE: debug.keystore
        SIGNING_STORE_PASSWORD: android
        SIGNING_KEY_ALIAS: androiddebugkey
        SIGNING_KEY_PASSWORD: android

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
